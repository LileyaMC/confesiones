<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Panel de Confesiones en Vivo</title>

    <!-- Fuentes modernas -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800&family=Righteous&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">

    <!-- Estilos CSS -->
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <!-- Fondos de Iluminación Ambiental -->
    <div class="luz-ambiental luz-1"></div>
    <div class="luz-ambiental luz-2"></div>

    <!-- Contenedor Dinámico de Nubes en Desplazamiento Izquierda -> Derecha (No Uniforme) -->
    <div id="contenedor-nubes" aria-hidden="true">
        <div class="nube nube-1"></div>
        <div class="nube nube-2"></div>
        <div class="nube nube-3"></div>
        <div class="nube nube-4"></div>
        <div class="nube nube-5"></div>
        <div class="nube nube-6"></div>
        <div class="nube nube-7"></div>
        <div class="nube nube-8"></div>
    </div>

    <!-- Contenedor Principal de la Aplicación -->
    <div class="contenedor">

        <div class="encabezado">
            <h1>Confesiones Anónimas</h1>
            <p class="subtitulo">Descubre los secretos y pensamientos en tiempo real</p>
        </div>

        <!-- Lista donde se renderizan las tarjetas -->
        <div id="lista-confesiones"></div>
    </div>

    <!-- Lógica JavaScript -->
    <script src="script.js"></script>
</body>

</html>
